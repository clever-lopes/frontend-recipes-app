name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Cypress is a dev dependency left from the course evaluator; its binary
      # is never used here.
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'

      # The deploy only happens if the suite passes.
      - run: npm test

      # vite.config.js sets the /frontend-recipes-app/ base for builds.
      - run: npm run build

      # GitHub Pages has no SPA rewrites: serving index.html as the 404 page
      # lets deep links like /foods/52771 load the app and route client-side.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
